[package]
name = "yuwen"
version = "0.1.0"
edition = "2021"
description = "A small X (Twitter) CLI: post, read, edit and delete from your terminal"
license = "MIT"
rust-version = "1.85"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5"
open = "5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[profile.release]
strip = true
lto = true
